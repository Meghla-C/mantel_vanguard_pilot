resources:
  jobs:
    geoscape_job:
      name: geoscape_job
      email_notifications:
        on_failure:
          - ${var.failure_email_list}
      tasks:
        - task_key: ingest_geoscape_roads
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "geoscape_roads",
                              "yaml_config_file": "ingest/geoscape.yml",
                              "requirements_file": "src/etl_framework_requirements.txt",
                              "logs_directory": "meta/etl_framework_logs"}

        - task_key: clean_geoscape_roads
          depends_on:
            - task_key: ingest_geoscape_roads
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "geoscape_roads",
                              "yaml_config_file": "clean/geoscape.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}    

    northwind_job:
      name: northwind_job
      email_notifications:
        on_failure:
          - ${var.failure_email_list}

      tasks:
        - task_key: ingest_customers
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "customers",
                              "yaml_config_file": "ingest/northwind.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: ingest_products
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "products",
                              "yaml_config_file": "ingest/northwind.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: ingest_orders
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "orders",
                              "yaml_config_file": "ingest/northwind.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: clean_customers
          depends_on:
            - task_key: ingest_customers
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "customers",
                              "yaml_config_file": "clean/northwind.yml", 
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: clean_products
          depends_on:
            - task_key: ingest_products
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "products",
                              "yaml_config_file": "clean/northwind.yml", 
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: clean_orders
          depends_on:
            - task_key: ingest_orders
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "orders",
                              "yaml_config_file": "clean/northwind.yml", 
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: clean_orders
          depends_on:
            - task_key: ingest_orders
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "orders",
                              "yaml_config_file": "clean/northwind.yml", 
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: enrich_orders
          depends_on:
            - task_key: clean_orders
            - task_key: clean_customers
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "orders",
                              "yaml_config_file": "enrich/orders.yml", 
                              "requirements_file": "src/etl_framework_requirements.txt"}

        - task_key: agg_sales_summary
          depends_on:
            - task_key: enrich_orders
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "sales_summary",
                              "yaml_config_file": "agg/sales_summary.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}       
    

    openweather_job:
      name: openweather_job
      email_notifications:
        on_failure:
          - ${var.failure_email_list}
      tasks:
        - task_key: ingest_openweather
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "openweather_currentweather",
                              "yaml_config_file": "ingest/openweather.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}
        

        - task_key: clean_openweather
          depends_on:
            - task_key: ingest_openweather
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "openweather_currentweather",
                              "yaml_config_file": "clean/openweather.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}    

    computershare_holdings:
      name: computershare_holdings_job
      email_notifications:
        on_failure:
          - ${var.failure_email_list}
      trigger:
          pause_status: PAUSED
          file_arrival:
              url: /Volumes/development/vanguard_landing/computershare-holdings/
      tasks:
        - task_key: ingest_computershare_holdings
          notebook_task:
            notebook_path: ../src/pipelines/data_etl_pipeline.py
            base_parameters: {"entity": "computershare_holdings",
                              "yaml_config_file": "ingest/computershare_holdings.yml",
                              "requirements_file": "src/etl_framework_requirements.txt"}
      